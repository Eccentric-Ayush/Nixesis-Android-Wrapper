kind = "web"
previewPath = "/"
title = "Nixesis"
description = "Nixesis helps people build a winter arc through repeatable habits, fitness goals, and community challenges. This artifact hosts the existing web client and its Capacitor Android wrapper."
version = "1.0.0"
id = "artifacts/nixesis"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20596

[services.development]
run = "pnpm --filter @workspace/nixesis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nixesis", "run", "build" ]
serve = "static"
publicDir = "artifacts/nixesis/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20596"
BASE_PATH = "/"
